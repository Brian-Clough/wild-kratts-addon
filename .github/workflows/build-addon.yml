name: Build Wild Kratts Add-on

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package .mcaddon
        run: |
          mkdir -p dist
          cd behavior_pack && zip -r ../dist/WildKratts_BP.mcpack . && cd ..
          cd resource_pack && zip -r ../dist/WildKratts_RP.mcpack . && cd ..
          cd dist && zip -r WildKratts_Addon.mcaddon WildKratts_BP.mcpack WildKratts_RP.mcpack

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WildKratts_Addon
          path: dist/WildKratts_Addon.mcaddon

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WildKratts_Addon.mcaddon
